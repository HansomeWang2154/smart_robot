[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "classic-pick-place"
version = "0.1.0"
description = "Classical collision-free Franka Panda pick and place in MuJoCo"
requires-python = ">=3.10"
dependencies = [
  "mujoco>=3.2",
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]


